services:
  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - ./backend/model:/app/model:ro
    environment:
      MAX_SIDE: "0"  # 0 = foto penuh, sama dengan notebook
      FLATTEN_MODE: "fast"  # fast (tercepat) | accurate (~identik, 3x lebih lambat dari fast) | exact (identik, paling lambat)
      ENSEMBLE: "0"  # 0 = fold terbaik saja (cepat); 1 = 5 fold seperti notebook (akurat tapi ~5x lebih lambat)

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
      REQUEST_TIMEOUT: "300"  # detik; naikkan jika masih timeout
    depends_on:
      - backend
