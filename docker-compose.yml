services:
  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - ./backend/model:/app/model:ro
    environment:
      MAX_SIDE: "1600"  # 0 = matikan pengecilan foto

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
